[pytest]
# Coverage is configured but not enforced with --cov by default, because the fast
# feedback loop matters more than a number on every run. Measure with:
#
#   pytest --cov=lambda_source --cov-report=term-missing
#
# Baseline recorded in docs/backlog.md. pytest-cov is already in the dev extras.
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Fail on an unregistered marker rather than silently skipping, and surface warnings
# instead of hiding them.
filterwarnings =
    default

[coverage:run]
source = lambda_source
branch = True
omit =
    */__pycache__/*
    */tests/*

[coverage:report]
show_missing = True
skip_covered = False
exclude_lines =
    pragma: no cover
    if TYPE_CHECKING:
    raise NotImplementedError
